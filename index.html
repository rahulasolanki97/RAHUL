<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family:Arial;
  background:linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;
  padding:20px;
}
.card{
  background:#fff;
  max-width:420px;
  margin:auto;
  padding:20px;
  border-radius:15px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}
h2{text-align:center}
.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin:10px 0;
}
.box{
  padding:12px;
  border-radius:10px;
  color:#fff;
  text-align:center;
}
.income{background:#22c55e}
.expense{background:#ef4444}
.net{background:#2563eb}

.balance{
  background:#2563eb;
  color:#fff;
  padding:14px;
  border-radius:12px;
  text-align:center;
  margin:12px 0;
  font-size:22px;
}

input,select{
  width:100%;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  border:1px solid #ccc;
}

button{
  width:100%;
  padding:10px;
  border:none;
  border-radius:8px;
  margin-top:6px;
  font-weight:bold;
  cursor:pointer;
}
.add-income{background:#fde047}
.add-expense{background:#2563eb;color:#fff}

.txn{
  background:#f9f9f9;
  padding:10px;
  margin:6px 0;
  border-radius:8px;
  display:flex;
  justify-content:space-between;
}
.del{background:#ef4444;color:#fff;border-radius:6px;padding:4px 8px}
</style>
</head>

<body>

<div class="card">
<h2>💰 Expense Tracker</h2>
<p>Welcome, <b id="user"></b></p>

<!-- PERIOD SELECT -->
<select id="period" onchange="updateDashboard()">
  <option value="day">Today</option>
  <option value="month" selected>This Month</option>
  <option value="year">This Year</option>
</select>

<!-- DASHBOARD -->
<div class="dashboard">
  <div class="box income">Income<br><b id="dIncome">₹0</b></div>
  <div class="box expense">Expense<br><b id="dExpense">₹0</b></div>
  <div class="box net">Net<br><b id="dNet">₹0</b></div>
</div>

<div class="balance">
  Balance<br><b id="balance">₹0</b>
</div>

<!-- ✅ AMOUNT ABOVE DESCRIPTION -->
<input id="amount" type="number" placeholder="Amount">
<input id="description" placeholder="Description">

<select id="category">
  <option>Food</option>
  <option>Fuel</option>
  <option>Bills</option>
  <option>Shopping</option>
</select>

<button class="add-income" onclick="addTxn('income')">➕ Add Income</button>
<button class="add-expense" onclick="addTxn('expense')">➖ Add Expense</button>

<hr>
<div id="list"></div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbxBmiZvG66vPFrTT6W7gpcoXXN-PemcSHCkCSFLB_IEkr28t0qElMEEavWeiDTqZSNv/exec";
const USERNAME = "Rahul";
document.getElementById("user").textContent = USERNAME;

let transactions = [];

/* LOAD */
async function load(){
  const r = await fetch(`${URL}?action=fetch&username=${USERNAME}`);
  const j = await r.json();
  transactions = j.transactions || [];
  updateDashboard();
  render();
}

/* ADD */
async function addTxn(type){
  const amt = +amount.value;
  const desc = description.value.trim();
  if(!amt || !desc) return alert("Enter amount & description");

  await fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      action:"add",
      username:USERNAME,
      type:type,
      description:desc,
      amount:amt,
      category:category.value
    })
  });

  amount.value="";
  description.value="";
  load();
}

/* DELETE */
async function delTxn(row){
  if(!confirm("Delete this transaction?")) return;
  await fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      action:"delete",
      username:USERNAME,
      row:row
    })
  });
  load();
}

/* DASHBOARD */
function updateDashboard(){
  let income=0,expense=0;
  const now = new Date();
  const period = document.getElementById("period").value;

  transactions.forEach(t=>{
    const d = new Date(t.date.split("T")[0]);
    let ok=false;

    if(period==="day"){
      ok = d.toDateString() === now.toDateString();
    }
    if(period==="month"){
      ok = d.getMonth()===now.getMonth() &&
           d.getFullYear()===now.getFullYear();
    }
    if(period==="year"){
      ok = d.getFullYear()===now.getFullYear();
    }

    if(ok){
      t.type==="income" ? income+=t.amount : expense+=t.amount;
    }
  });

  dIncome.textContent = `₹${income}`;
  dExpense.textContent = `₹${expense}`;
  dNet.textContent = `₹${income-expense}`;
  balance.textContent = `₹${income-expense}`;
}

/* LIST */
function render(){
  list.innerHTML = transactions
    .sort((a,b)=>new Date(b.date)-new Date(a.date))
    .map(t=>`
      <div class="txn">
        <div>
          ${t.type==="income"?"+":"-"}₹${t.amount}<br>
          <small>${t.description} • ${t.category}</small>
        </div>
        <button class="del" onclick="delTxn(${t.row})">✕</button>
      </div>
    `).join("");
}

load();
</script>

</body>
</html>
