<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Expense Tracker</title>
<style>
body{font-family:Arial;background:#f4f4f4;padding:20px}
.box{background:#fff;padding:20px;max-width:500px;margin:auto;border-radius:10px}
.txn{display:flex;justify-content:space-between;margin:6px 0}
button{cursor:pointer}
</style>
</head>

<body>
<div class="box">
<h2>Expense Tracker</h2>

<p>
Income: <b id="income">0</b> |
Expense: <b id="expense">0</b> |
Net: <b id="net">0</b>
</p>

<input id="amt" type="number" placeholder="Amount">
<input id="desc" placeholder="Description">
<select id="cat">
  <option>Food</option>
  <option>Bills</option>
  <option>Shopping</option>
</select>

<br><br>
<button onclick="add('income')">Add Income</button>
<button onclick="add('expense')">Add Expense</button>

<hr>
<div id="list"></div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbxuFGKwVh0K7SaXigRGqW9774Fa12tb0kEP-vN0LCPiZbwN967DrDXrqx0LHjKIAZ2x/exec";
const USERNAME = "Rahul";
let transactions = [];

/* ---------- LOAD ---------- */
async function load() {
  const r = await fetch(`${URL}?action=fetch&username=${USERNAME}`);
  const j = await r.json();
  transactions = j.transactions || [];
  dashboard();
  render();
}

/* ---------- ADD ---------- */
async function add(type) {
  await fetch(URL, {
    method: "POST",
    body: JSON.stringify({
      action: "add",
      username: USERNAME,
      type,
      description: desc.value,
      amount: +amt.value,
      category: cat.value
    })
  });
  amt.value = desc.value = "";
  load();
}

/* ---------- DELETE ---------- */
async function del(row) {
  await fetch(URL, {
    method: "POST",
    body: JSON.stringify({
      action: "delete",
      username: USERNAME,
      row
    })
  });
  load();
}

/* ---------- DASHBOARD ---------- */
function dashboard() {
  const now = new Date();
  let inc = 0, exp = 0;

  transactions.forEach(t => {
    const d = new Date(t.date.split("T")[0]);
    if (d.getMonth() === now.getMonth() &&
        d.getFullYear() === now.getFullYear()) {
      t.type === "income" ? inc += t.amount : exp += t.amount;
    }
  });

  income.textContent = inc;
  expense.textContent = exp;
  net.textContent = inc - exp;
}

/* ---------- LIST ---------- */
function render() {
  list.innerHTML = transactions
    .sort((a,b)=>new Date(b.date)-new Date(a.date))
    .map(t => `
      <div class="txn">
        <span>${t.type} ₹${t.amount} (${t.category})</span>
        <button onclick="del(${t.row})">❌</button>
      </div>
    `).join("");
}

load();
</script>
</body>
</html>
