<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Expense Tracker</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg,#667eea,#764ba2);
  min-height:100vh;
  padding:20px;
}
.card{
  background:#fff;
  max-width:420px;
  margin:auto;
  padding:20px;
  border-radius:16px;
  box-shadow:0 15px 40px rgba(0,0,0,.3);
}
h2{text-align:center;margin-bottom:5px}
p{text-align:center;margin-bottom:15px}

.dashboard{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-bottom:15px;
}
.box{
  padding:14px;
  border-radius:12px;
  color:#fff;
  text-align:center;
  font-size:14px;
}
.income{background:#22c55e}
.expense{background:#ef4444}
.net{background:#2563eb}

.balance{
  background:#2563eb;
  color:#fff;
  padding:16px;
  border-radius:14px;
  text-align:center;
  margin-bottom:15px;
}
.balance b{font-size:28px}

input,select{
  width:100%;
  padding:11px;
  margin:6px 0;
  border-radius:10px;
  border:1px solid #ccc;
  font-size:14px;
}

button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border:none;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  font-size:15px;
}
.add-income{background:#fde047}
.add-expense{background:#2563eb;color:#fff}

.txn{
  background:#f9f9f9;
  padding:10px;
  margin:8px 0;
  border-radius:10px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}
.txn small{color:#666}
.del{background:#ef4444;color:#fff;padding:6px 10px;border-radius:6px}
</style>
</head>

<body>

<div class="card">
  <h2>💰 Expense Tracker</h2>
  <p>Welcome, <b id="user"></b></p>

  <!-- ✅ DASHBOARD (NOW VISIBLE) -->
  <div class="dashboard">
    <div class="box income">
      Income<br><b id="dashIncome">₹0</b>
    </div>
    <div class="box expense">
      Expense<br><b id="dashExpense">₹0</b>
    </div>
    <div class="box net">
      Net<br><b id="dashNet">₹0</b>
    </div>
  </div>

  <!-- BALANCE -->
  <div class="balance">
    Current Balance<br>
    <b id="balance">₹0</b>
  </div>

  <!-- ✅ INPUT ORDER FIXED -->
  <input id="amount" type="number" placeholder="Amount">
  <input id="description" placeholder="Description">

  <select id="category">
    <option>Food</option>
    <option>Fuel</option>
    <option>Bills</option>
    <option>Shopping</option>
  </select>

  <button class="add-income" onclick="addTxn('income')">💰 Add Income</button>
  <button class="add-expense" onclick="addTxn('expense')">💸 Add Expense</button>

  <hr>
  <h3>Transactions</h3>
  <div id="list"></div>
</div>

<script>
const URL = "https://script.google.com/macros/s/AKfycbzI4rxvQhIvx4K_FcxHDubC0iKNLYWjY8nUd8x8J3oWAbth7bZFJxBCPyyFSBrOiwuz/exec";
const USERNAME = "Rahul";
document.getElementById("user").textContent = USERNAME;

let transactions = [];

/* LOAD DATA */
async function load(){
  const r = await fetch(`${URL}?action=fetch&username=${USERNAME}`);
  const j = await r.json();
  transactions = j.transactions || [];
  updateDashboard();
  render();
}

/* ADD */
async function addTxn(type){
  const amt = +amount.value;
  const desc = description.value.trim();
  if(!amt || !desc){
    alert("Enter amount and description");
    return;
  }

  await fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      action:"add",
      username:USERNAME,
      type:type,
      description:desc,
      amount:amt,
      category:category.value
    })
  });

  amount.value="";
  description.value="";
  load();
}

/* DELETE */
async function delTxn(row){
  if(!confirm("Delete this transaction?")) return;

  await fetch(URL,{
    method:"POST",
    body:JSON.stringify({
      action:"delete",
      username:USERNAME,
      row:row
    })
  });
  load();
}

/* DASHBOARD */
function updateDashboard(){
  let income=0, expense=0;
  const now = new Date();

  transactions.forEach(t=>{
    const d = new Date(t.date.split("T")[0]);
    if(d.getMonth()===now.getMonth() &&
       d.getFullYear()===now.getFullYear()){
      t.type==="income" ? income+=t.amount : expense+=t.amount;
    }
  });

  dashIncome.textContent = `₹${income}`;
  dashExpense.textContent = `₹${expense}`;
  dashNet.textContent = `₹${income-expense}`;
  balance.textContent = `₹${income-expense}`;
}

/* LIST */
function render(){
  list.innerHTML = transactions
    .sort((a,b)=>new Date(b.date)-new Date(a.date))
    .map(t=>`
      <div class="txn">
        <div>
          ${t.type==="income"?"+":"-"}₹${t.amount}<br>
          <small>${t.description} • ${t.category}</small>
        </div>
        <button class="del" onclick="delTxn(${t.row})">✕</button>
      </div>
    `).join("");
}

load();
</script>

</body>
</html>
